name: Feature Request
description: Propose a new feature, platform destination, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Simple Streamer better? We welcome broadcaster feedback!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or friction is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives You've Considered
      description: Any alternative solutions or workarounds you've evaluated.

  - type: textarea
    id: context
    attributes:
      label: Additional Context or Mockups
      description: Add any screenshots, mockups, or platform API references here.
