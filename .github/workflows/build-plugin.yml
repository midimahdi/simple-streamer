name: Build Cross-Platform OBS Plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS Universal Plugin (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OBS Studio (Apple Silicon)
        run: |
          curl -sL https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-macOS-Apple.dmg -o obs-apple.dmg
          hdiutil attach obs-apple.dmg -mountpoint /Volumes/OBS_ARM
          mkdir -p /tmp/obs-arm
          cp -R /Volumes/OBS_ARM/OBS.app /tmp/obs-arm/
          hdiutil detach /Volumes/OBS_ARM

      - name: Download OBS Studio (Intel x86_64)
        run: |
          curl -sL https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-macOS-Intel.dmg -o obs-intel.dmg
          hdiutil attach obs-intel.dmg -mountpoint /Volumes/OBS_INTEL
          mkdir -p /tmp/obs-intel
          cp -R /Volumes/OBS_INTEL/OBS.app /tmp/obs-intel/
          hdiutil detach /Volumes/OBS_INTEL

      - name: Compile Universal Plugin Binary
        run: |
          mkdir -p plugin/build/arm64 plugin/build/x86_64 plugin/build/universal/Contents/MacOS

          # Compile arm64
          clang -bundle -fPIC -O3 \
            -arch arm64 \
            -Iplugin/include \
            -Iplugin/include/libobs \
            -Iplugin/include/frontend-api \
            -F/tmp/obs-arm/OBS.app/Contents/Frameworks \
            -framework libobs \
            /tmp/obs-arm/OBS.app/Contents/Frameworks/obs-frontend-api.dylib \
            -rpath @loader_path/../../.. \
            -rpath /Applications/OBS.app/Contents/Frameworks \
            plugin/src/simple-streamer.c \
            -o plugin/build/arm64/simple-streamer

          # Compile x86_64
          clang -bundle -fPIC -O3 \
            -arch x86_64 \
            -Iplugin/include \
            -Iplugin/include/libobs \
            -Iplugin/include/frontend-api \
            -F/tmp/obs-intel/OBS.app/Contents/Frameworks \
            -framework libobs \
            /tmp/obs-intel/OBS.app/Contents/Frameworks/obs-frontend-api.dylib \
            -rpath @loader_path/../../.. \
            -rpath /Applications/OBS.app/Contents/Frameworks \
            plugin/src/simple-streamer.c \
            -o plugin/build/x86_64/simple-streamer

          # Combine into Universal Binary (Fat)
          lipo -create -output plugin/build/universal/Contents/MacOS/simple-streamer \
            plugin/build/arm64/simple-streamer \
            plugin/build/x86_64/simple-streamer

          lipo -info plugin/build/universal/Contents/MacOS/simple-streamer

          # Copy Info.plist
          cp plugin/build/simple-streamer.plugin/Contents/Info.plist plugin/build/universal/Contents/Info.plist 2>/dev/null || cat << 'PLIST' > plugin/build/universal/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>simple-streamer</string>
            <key>CFBundleIdentifier</key>
            <string>com.bdjlmn.simple-streamer.plugin</string>
            <key>CFBundleName</key>
            <string>Simple Streamer</string>
            <key>CFBundlePackageType</key>
            <string>BNDL</string>
            <key>CFBundleShortVersionString</key>
            <string>2.2.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
          </dict>
          </plist>
          PLIST

          mv plugin/build/universal plugin/build/simple-streamer.plugin

      - name: Archive macOS Universal Plugin
        run: |
          cd plugin/build
          tar -czvf simple-streamer-macos-universal.tar.gz simple-streamer.plugin

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-streamer-macos-universal
          path: plugin/build/simple-streamer-macos-universal.tar.gz

  build-windows:
    name: Build Windows x64 Native DLL & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OBS Studio x64 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/29.1.3/OBS-Studio-29.1.3.zip" -OutFile "obs-win.zip"
          Expand-Archive -Path "obs-win.zip" -DestinationPath "obs-win"

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate Import Libraries from obs.dll and obs-frontend-api.dll
        shell: pwsh
        run: |
          mkdir obs-libs -Force | Out-Null
          
          # Generate obs.lib from obs-win/bin/64bit/obs.dll
          dumpbin /EXPORTS obs-win/bin/64bit/obs.dll > obs.exports
          $obsExports = @("LIBRARY obs.dll", "EXPORTS")
          Get-Content obs.exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+([^\s]+)') {
              $obsExports += $matches[1]
            }
          }
          $obsExports | Set-Content obs.def -Encoding ascii
          lib /def:obs.def /machine:x64 /out:obs-libs/obs.lib

          # Generate obs-frontend-api.lib
          dumpbin /EXPORTS obs-win/bin/64bit/obs-frontend-api.dll > fe.exports
          $feExports = @("LIBRARY obs-frontend-api.dll", "EXPORTS")
          Get-Content fe.exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+([^\s]+)') {
              $feExports += $matches[1]
            }
          }
          $feExports | Set-Content obs-frontend-api.def -Encoding ascii
          lib /def:obs-frontend-api.def /machine:x64 /out:obs-libs/obs-frontend-api.lib

      - name: Compile simple-streamer.dll (MSVC x64 Static CRT)
        shell: cmd
        run: |
          mkdir plugin\build\x64
          cl.exe /LD /O2 /MT /W3 ^
            /I plugin\include ^
            /I plugin\include\libobs ^
            /I plugin\include\frontend-api ^
            /I obs-win\bin\64bit ^
            plugin\src\simple-streamer.c ^
            /link /LIBPATH:obs-libs obs.lib obs-frontend-api.lib ^
            /OUT:plugin\build\x64\simple-streamer.dll

      - name: Compile simple-streamer-bridge.exe (MSVC x64 Static CRT, GUI Subsystem)
        shell: cmd
        run: |
          mkdir dist
          cl.exe /O2 /MT /W3 ^
            installer\windows\simple-streamer-bridge.c ^
            /link /SUBSYSTEM:WINDOWS ws2_32.lib winhttp.lib bcrypt.lib shell32.lib user32.lib advapi32.lib iphlpapi.lib ole32.lib ^
            /OUT:dist\simple-streamer-bridge.exe

      - name: Verify & Assert Zero External Runtime Dependencies
        shell: pwsh
        run: |
          $deps = (dumpbin /DEPENDENTS plugin\build\x64\simple-streamer.dll | Out-String)
          Write-Host $deps
          if ($deps -match "vcruntime" -or $deps -match "msvcp") {
            Write-Error "FATAL: DLL links against dynamic MSVC runtime! Must compile with /MT."
            exit 1
          }
          if ($deps -match "fe\.dll") {
            Write-Error "FATAL: DLL imports fe.dll instead of obs-frontend-api.dll! Check .def file LIBRARY declaration."
            exit 1
          }
          if (-not ($deps -match "obs\.dll") -or -not ($deps -match "obs-frontend-api\.dll")) {
            Write-Error "FATAL: DLL is missing expected OBS core or frontend-api imports!"
            exit 1
          }
          $bdeps = (dumpbin /DEPENDENTS dist\simple-streamer-bridge.exe | Out-String)
          Write-Host $bdeps
          if ($bdeps -match "vcruntime" -or $bdeps -match "msvcp") {
            Write-Error "FATAL: bridge.exe links against dynamic MSVC runtime! Must compile with /MT."
            exit 1
          }
          Write-Host "SUCCESS: Import tables strictly verified (zero dynamic CRT dependencies)."

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item -Path "plugin\build\x64\simple-streamer.dll" -Destination "dist\simple-streamer.dll" -Force
          New-Item -ItemType Directory -Path "dist\SimpleStreamer" -Force | Out-Null
          Copy-Item -Path "installer\windows\*" -Destination "dist\SimpleStreamer" -Recurse
          New-Item -ItemType Directory -Path "dist\SimpleStreamer\plugin\64bit" -Force | Out-Null
          Copy-Item -Path "plugin\build\x64\simple-streamer.dll" -Destination "dist\SimpleStreamer\plugin\64bit\" -Force
          Copy-Item -Path "plugin\build\x64\simple-streamer.dll" -Destination "dist\SimpleStreamer\" -Force
          Compress-Archive -Path "dist\SimpleStreamer\*" -DestinationPath "dist\SimpleStreamer-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build SimpleStreamer-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compiling installer using: $iscc"
          & $iscc installer\windows\SimpleStreamer-Setup.iss
          if (-not (Test-Path "dist\SimpleStreamer-Setup.exe")) {
            Write-Error "Failed to generate dist\SimpleStreamer-Setup.exe"
            exit 1
          }
          Write-Host "SUCCESS: dist\SimpleStreamer-Setup.exe built successfully."

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-streamer-windows-x64
          path: |
            dist/SimpleStreamer-Setup.exe
            dist/SimpleStreamer-Windows-x64.zip
            dist/simple-streamer.dll
            dist/simple-streamer-bridge.exe

  release:
    name: Publish Continuous Release
    needs: [build-macos, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: simple-streamer-macos-universal
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: simple-streamer-windows-x64
          path: release-assets

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Simple Streamer Latest Build
          body: Continuous build of Simple Streamer native plugins, native Windows C bridge, macOS installer, and Windows .exe installer bundle with SHA-256 checksums.
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
