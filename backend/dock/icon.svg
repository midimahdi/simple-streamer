<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with precision border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272A" stroke-width="4" />
  
  <!-- Subtle Inner Top Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#glowGrad)" pointer-events="none" />

  <!-- Concentric Dual Broadcast Waves (Top) -->
  <!-- Outer Wave -->
  <path
    d="M 120,180 A 160,160 0 0,1 392,180"
    fill="none"
    stroke="#52525B"
    stroke-width="14"
    stroke-linecap="round"
  />
  
  <!-- Mid Wave -->
  <path
    d="M 160,205 A 115,115 0 0,1 352,205"
    fill="none"
    stroke="#A1A1AA"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Inner Active Wave -->
  <path
    d="M 202,232 A 68,68 0 0,1 310,232"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#subtleGlow)"
  />

  <!-- Central Mosque Silhouette & Inverted Keyhole Arch -->
  <!-- Outer Mosque Arch Shape -->
  <path
    d="M 256,195
       C 264,222 292,260 326,290
       L 326,380
       L 186,380
       L 186,290
       C 220,260 248,222 256,195 Z"
    fill="#18181B"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Inner Architectural Mihrab Cutout -->
  <path
    d="M 256,252
       C 262,272 278,295 294,312
       L 294,380
       L 218,380
       L 218,312
       C 234,295 250,272 256,252 Z"
    fill="#090A0F"
    stroke="#71717A"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Signal Beacon Core (Broadcast Apex) -->
  <circle cx="256" cy="195" r="14" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="256" cy="195" r="7" fill="#18181B" />

  <!-- Dual Stream Status Dots (Left = YouTube, Right = Facebook) -->
  <!-- Bottom Foundation / Pedestal Bar -->
  <line x1="160" y1="404" x2="352" y2="404" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
</svg>
